Ran 2 commands, read a file
Три файла: workflow (кладётся в .github/workflows/), prod-версия compose с image вместо build, и REGISTRY.md с полным разбором.

Коротко о схеме: пушите код → Actions собирает → образ в ghcr.io → на VPS docker compose pull. Сервер перестаёт быть стройплощадкой и становится просто исполнителем.

Три момента, на которых обычно спотыкаются:

Имя образа только строчными буквами. ghcr.io/Ivan/repo не пройдёт, нужно ghcr.io/ivan/repo.
Новый пакет создаётся приватным. Либо переключаете на Public в настройках пакета, либо делаете docker login ghcr.io на VPS с токеном, у которого есть read:packages.
Строка packages: write в workflow обязательна, иначе пуш упадёт с 403.
Секретов в образе нет — .dockerignore отсекает data/ и .env. Но если решите делать пакет публичным, проверьте это до первой сборки: слой, уехавший в реестр, обратно не отзовёшь.


