Что там внутри. Dockerfile — это python:3.12-slim плюс curl, копируется только app.py, добавлен HEALTHCHECK на /health. Compose монтирует целиком ~/.notebooklm с хоста в /root/.notebooklm на чтение-запись, чтобы библиотека могла обновлять куки. Логика та же, что мы обсуждали, только профиль целиком, а не один json.

Проблема первая: порт открыт наружу. В compose стоит "8000:8000" — на VPS это значит, что API доступен из интернета всем. При этом ключ подставляется как ${NOTEBOOKLM_REST_API_KEY:-}, то есть по умолчанию пустой. Получается дверь без замка к вашему гугл-аккаунту. Меняйте на:

yaml
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NOTEBOOKLM_REST_API_KEY: ${NOTEBOOKLM_REST_API_KEY:?задайте ключ}
