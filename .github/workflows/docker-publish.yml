Searched the web
Да, при публичном репозитории и публичном пакете — бесплатно, и по обеим статьям сразу.

Хранение и трафик. Использование GitHub Packages бесплатно для публичных пакетов, а входящий трафик из любого источника не тарифицируется вовсе. Квоты и лимиты (те самые 500 МБ / 1 ГБ на Free-плане) относятся только к приватным пакетам. Ваш образ с Playwright потянет примерно на 1.5–2 ГБ — для приватного это была бы проблема, для публичного нет.

Минуты сборки. Для публичных репозиториев минуты Actions остаются бесплатными, так что workflow не расходует лимит. 
GitHub

Отдельно стоит знать: хранение и пропускная способность образов в Container registry сейчас бесплатны в принципе, и о любом изменении этой политики GitHub обещает предупредить минимум за месяц. То есть даже приватный вариант пока не тарифицируется — но это временная льгота, а бесплатность публичных пакетов постоянная.

Практический вывод: делайте пакет публичным. Помимо нулевой стоимости это избавляет от docker login на VPS.

Единственное — ровно поэтому стоит ещё раз проверить, что в образ не попало лишнего. Публичный образ скачает кто угодно, а удалённый слой может остаться в зеркалах и кешах. Перед тем как переключать видимость:

bash
docker run --rm ghcr.io/ваш_логин/notebooklm-rest-api:latest \
  sh -c "ls -la /app /data 2>&1"
Если внутри только app.py и пустая /data — всё чисто.






