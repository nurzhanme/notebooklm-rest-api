services:
  notebooklm:
    build: .
    container_name: notebooklm-rest-api
    ports:
      # Наружу не торчит. Для внешнего доступа — nginx с TLS впереди.
      - "127.0.0.1:8000:8000"
    volumes:
      # Профиль целиком: библиотека сама обновляет куки, ей нужна запись
      - ./data/.notebooklm:/data/.notebooklm
    environment:
      # Без ключа контейнер не стартует — это намеренно
      NOTEBOOKLM_REST_API_KEY: ${NOTEBOOKLM_REST_API_KEY:?задайте ключ в .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
